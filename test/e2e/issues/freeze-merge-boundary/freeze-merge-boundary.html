<!DOCTYPE html>
<!--
  Mirrors src/renderFreeze.ts's applyFreeze() row-freeze loop, specifically
  testing a merged (rowSpan>1) cell anchored so its TRUE bottom edge lands
  exactly on the frozen row band's boundary — the row-axis mirror of the
  colSpan-aware seam fix the column-freeze loop already had. Reproduced
  from a real user table (test/rich-table-test.md in the vault): freezeRows
  3, freezeCols 3, a merge spanning rows 2-3 and columns 1-2 (entirely
  inside the frozen block, anchored one row above the frozen band's true
  bottom, extending down INTO it) — reported as a stray leaking line and
  clipped/obscured text right at that merge.

  window.applyFreezeRows(freezeRows) runs only the ported row-freeze pass
  (column-freeze isn't needed to exercise this specific bug) against
  #table.
-->
<html>
<head>
<link rel="stylesheet" href="../../common/obsidian-vars.css">
<link rel="stylesheet" href="../../../../styles.css">
</head>
<body>
	<div class="bt-render-root bt-theme-grid" id="root">
		<table class="bt-table" id="table" style="table-layout:fixed; width:300px;">
			<colgroup><col data-col="0" style="width:100px"><col data-col="1" style="width:100px"><col data-col="2" style="width:100px"></colgroup>
			<thead><tr>
				<th class="bt-th" data-row="0" data-col="0">A</th>
				<th class="bt-th" data-row="0" data-col="1">B</th>
				<th class="bt-th" data-row="0" data-col="2">C</th>
			</tr></thead>
			<tbody>
				<tr>
					<td class="bt-td" data-row="1" data-col="0">1</td>
					<td class="bt-td" data-row="1" data-col="1">2</td>
					<td class="bt-td" data-row="1" data-col="2">3</td>
				</tr>
				<tr>
					<td class="bt-td" data-row="2" data-col="0">4</td>
					<!-- merge: anchored at [row2,col1], spans rows 2-3, cols 1-2 -->
					<td class="bt-td" data-row="2" data-col="1" rowspan="2" colspan="2" id="mergedCell">aaa</td>
				</tr>
				<tr>
					<td class="bt-td" data-row="3" data-col="0">7</td>
					<!-- cols 1,2 covered by the rowspan/colspan merge above -->
				</tr>
				<tr>
					<td class="bt-td" data-row="4" data-col="0">10</td>
					<td class="bt-td" data-row="4" data-col="1">11</td>
					<td class="bt-td" data-row="4" data-col="2">12</td>
				</tr>
			</tbody>
		</table>
	</div>
<script>
	function forceImportant(el, prop, value) { el.style.setProperty(prop, value, 'important'); }
	function addBoxShadow(cell, layer) {
		const existing = cell.style.getPropertyValue('--bt-frozen-box-shadow-scratch');
		const combined = existing ? `${existing}, ${layer}` : layer;
		cell.style.setProperty('--bt-frozen-box-shadow-scratch', combined);
		forceImportant(cell, 'box-shadow', combined);
	}
	const LINE = 'var(--bt-frozen-divider, var(--background-modifier-border))';
	function seedThemeShadow(cell) {
		if (cell.style.getPropertyValue('--bt-frozen-box-shadow-scratch')) return;
		const themed = getComputedStyle(cell).boxShadow;
		if (themed && themed !== 'none') {
			cell.style.setProperty('--bt-frozen-box-shadow-scratch', themed);
			forceImportant(cell, 'box-shadow', themed);
		}
	}
	function opaqueBg(cell) {
		const isHeader = cell.tagName === 'TH';
		forceImportant(cell, 'background-color', isHeader ? 'var(--bt-frozen-header-bg, var(--background-secondary))' : 'var(--bt-frozen-bg, var(--background-primary))');
	}
	function hideBorder(el, side) { forceImportant(el, `border-${side}-color`, 'transparent'); }

	// `rowSpanAware` toggles between the pre-fix (idx === freezeRows) and
	// post-fix (idx + rowSpan - 1 === freezeRows) bottom-edge condition.
	window.applyFreezeRows = function (freezeRows, rowSpanAware) {
		const table = document.getElementById('table');
		const thead = table.querySelector('thead');
		const tbody = table.querySelector('tbody');

		table.style.removeProperty('border-top-color');
		const tableStyle = getComputedStyle(table);
		const outerTopColor = tableStyle.borderTopStyle !== 'none' ? tableStyle.borderTopColor : null;
		const outerTopWidth = outerTopColor !== null ? (parseFloat(tableStyle.borderTopWidth) || 1) : 1;
		const LINE_TOP = `var(--bt-frozen-divider, ${outerTopColor ?? 'var(--background-modifier-border)'})`;
		forceImportant(table, 'border-top-color', 'transparent');

		const allTrs = [...thead.querySelectorAll('tr'), ...tbody.querySelectorAll('tr')];
		for (const tr of allTrs) {
			const idxAttr = tr.querySelector('[data-row]')?.dataset.row;
			if (idxAttr === undefined) continue;
			const idx = parseInt(idxAttr);
			if (idx > freezeRows) continue;
			for (const cell of Array.from(tr.children)) {
				seedThemeShadow(cell);
				const rowEnd = rowSpanAware ? idx + (cell.rowSpan || 1) - 1 : idx;
				if (idx === 0) hideBorder(cell, 'top');
				if (rowEnd === freezeRows) hideBorder(cell, 'bottom');
				opaqueBg(cell);
				if (idx === 0) addBoxShadow(cell, `inset 0 ${outerTopWidth}px 0 0 ${LINE_TOP}`);
				if (rowEnd === freezeRows) {
					addBoxShadow(cell, `inset 0 -${outerTopWidth}px 0 0 ${LINE}`);
					addBoxShadow(cell, 'var(--bt-frozen-row-shadow, inset 0 -6px 6px -6px rgba(0, 0, 0, 0.3))');
				}
			}
		}
	};
</script>
</body>
</html>
